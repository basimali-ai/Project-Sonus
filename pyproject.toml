[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-sonus"
version = "1.0.0.65535"
description = "A real-time audio level and dosage meter for Windows."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    { name = "Syed Basim Ali", email = "basim.ali.contact@gmail.com" }
]
requires-python = ">=3.12.10,<3.13"
dependencies = [
    "cffi==2.0.0",
    "comtypes==1.4.13",
    "numpy==2.3.4",
    "psutil==7.1.2",
    "pycaw==20251023",
    "pycparser==2.23",
    "ruamel.yaml==0.18.16",
    "ruamel.yaml.clib==0.2.14",
    "scipy==1.16.2",
    "setuptools==78.1.1",
    "soundCard==0.4.5",
    "wheel==0.45.1",
    "pillow==12.0.0",
    "appdirs==1.4.4",
    "windows-toasts==1.3.1",
    "pywin32==311",
    "wxPython==4.2.4",
    "numcircbuf<2.0.0",
    "patch==1.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
]

[project.scripts]
sonus = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
ignore = ["E402", "RUF009", "DTZ005", "I001", "BLE001"]
